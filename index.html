<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ElectroCharge - Calculateur de recharge VE</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PWA Manifest link -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- En-tête -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 text-center sticky top-0 z-10 shadow-md">
        <h1 class="text-xl font-bold text-blue-400 flex items-center justify-center gap-2">
            ⚡ ElectroCharge
        </h1>
        <p class="text-xs text-slate-400">Optimisez vos recharges de véhicule électrique</p>
    </header>

    <!-- Contenu Principal -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 pb-24">
        
        <!-- ONGLET 1 : CALCULATEUR -->
        <section id="tab-calculator" class="space-y-4">
            
            <!-- Sélecteur rapide de favoris -->
            <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 flex gap-2">
                <div class="flex-1">
                    <label class="block text-xs text-slate-400 mb-1">Véhicule favori</label>
                    <select id="select-saved-car" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                        <option value="">-- Personnalisé --</option>
                    </select>
                </div>
                <div class="flex-1">
                    <label class="block text-xs text-slate-400 mb-1">Borne favorite</label>
                    <select id="select-saved-charger" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                        <option value="">-- Personnalisé --</option>
                    </select>
                </div>
            </div>

            <!-- Formulaire de calcul -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-4 shadow-lg">
                <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Paramètres de recharge</h2>
                
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Capacité de la batterie (kWh)</label>
                    <input type="number" id="battery-capacity" value="60" step="0.5" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-lg font-semibold text-slate-100 focus:outline-none focus:border-blue-500">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Niveau actuel (%)</label>
                        <input type="number" id="current-soc" value="20" min="0" max="100" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-lg font-semibold text-slate-100 focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Niveau cible (%)</label>
                        <input type="number" id="target-soc" value="80" min="0" max="100" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-lg font-semibold text-slate-100 focus:outline-none focus:border-blue-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">Puissance de la borne (kW)</label>
                    <input type="number" id="charger-power" value="11" step="0.5" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-lg font-semibold text-slate-100 focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">Rendement de charge (%) <span class="text-slate-500">défaut 90%</span></label>
                    <input type="number" id="efficiency" value="90" min="50" max="100" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-300 focus:outline-none focus:border-blue-500">
                </div>
            </div>

            <!-- Bloc Résultats -->
            <div class="bg-gradient-to-br from-blue-900/60 to-slate-800 p-5 rounded-xl border border-blue-500/30 shadow-xl space-y-3">
                <h2 class="text-xs font-semibold text-blue-300 uppercase tracking-wider">Résultats estimés</h2>
                
                <div class="text-center py-2">
                    <span id="result-time" class="text-3xl font-extrabold text-white">0h 00min</span>
                    <p class="text-xs text-slate-300 mt-1">Temps de recharge nécessaire</p>
                </div>

                <div class="grid grid-cols-2 gap-2 pt-3 border-t border-blue-500/20 text-center">
                    <div>
                        <span id="result-energy" class="text-lg font-bold text-slate-200">0 kWh</span>
                        <p class="text-[10px] text-slate-400">Énergie nécessaire</p>
                    </div>
                    <div>
                        <span id="result-cost" class="text-lg font-bold text-slate-200">0.00 €</span>
                        <p class="text-[10px] text-slate-400">Coût estimé (à 0.20€/kWh)</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- ONGLET 2 : GESTION DES FAVORIS -->
        <section id="tab-storage" class="hidden space-y-6">
            <!-- Véhicules -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
                <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Mes Véhicules</h2>
                <div class="flex gap-2">
                    <input type="text" id="new-car-name" placeholder="Nom (ex: Tesla Model 3)" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
                    <input type="number" id="new-car-capacity" placeholder="kWh" class="w-20 bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
                    <button onclick="addCar()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 rounded-lg font-medium text-sm transition-colors">+</button>
                </div>
                <div id="cars-list" class="space-y-2 mt-2">
                    <!-- Rempli en JS -->
                </div>
            </div>

            <!-- Bornes -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
                <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Mes Bornes / Prises</h2>
                <div class="flex gap-2">
                    <input type="text" id="new-charger-name" placeholder="Nom (ex: Borne Maison 7kW)" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
                    <input type="number" id="new-charger-power" placeholder="kW" class="w-20 bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
                    <button onclick="addCharger()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 rounded-lg font-medium text-sm transition-colors">+</button>
                </div>
                <div id="chargers-list" class="space-y-2 mt-2">
                    <!-- Rempli en JS -->
                </div>
            </div>
        </section>
    </main>

    <!-- Barre de Navigation Mobile en Bas -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-800 border-t border-slate-700 flex justify-around p-3 z-20">
        <button onclick="switchTab('calculator')" id="nav-calculator" class="flex flex-col items-center text-blue-400 font-medium text-xs">
            <span class="text-xl">⚡</span>
            <span>Calculateur</span>
        </button>
        <button onclick="switchTab('storage')" id="nav-storage" class="flex flex-col items-center text-slate-400 font-medium text-xs">
            <span class="text-xl">🚗</span>
            <span>Favoris</span>
        </button>
    </nav>

    <!-- Script JavaScript -->
    <script>
        // Gestion des onglets
        function switchTab(tab) {
            const calcSec = document.getElementById('tab-calculator');
            const storSec = document.getElementById('tab-storage');
            const navCalc = document.getElementById('nav-calculator');
            const navStor = document.getElementById('nav-storage');

            if (tab === 'calculator') {
                calcSec.classList.remove('hidden');
                storSec.classList.add('hidden');
                navCalc.className = "flex flex-col items-center text-blue-400 font-medium text-xs";
                navStor.className = "flex flex-col items-center text-slate-400 font-medium text-xs";
            } else {
                calcSec.classList.add('hidden');
                storSec.classList.remove('hidden');
                navStor.className = "flex flex-col items-center text-blue-400 font-medium text-xs";
                navCalc.className = "flex flex-col items-center text-slate-400 font-medium text-xs";
                renderStorageLists();
            }
        }

        // Calculs dynamiques
        const inputs = ['battery-capacity', 'current-soc', 'target-soc', 'charger-power', 'efficiency'];
        inputs.forEach(id => {
            document.getElementById(id).addEventListener('input', calculate);
        });

        function calculate() {
            const capacity = parseFloat(document.getElementById('battery-capacity').value) || 0;
            const currentSoc = parseFloat(document.getElementById('current-soc').value) || 0;
            const targetSoc = parseFloat(document.getElementById('target-soc').value) || 0;
            const power = parseFloat(document.getElementById('charger-power').value) || 1;
            const efficiency = (parseFloat(document.getElementById('efficiency').value) || 90) / 100;

            if (targetSoc <= currentSoc || power <= 0 || capacity <= 0) {
                document.getElementById('result-time').innerText = "0h 00min";
                document.getElementById('result-energy').innerText = "0 kWh";
                document.getElementById('result-cost').innerText = "0.00 €";
                return;
            }

            const socDiff = targetSoc - currentSoc;
            const energyNeeded = (capacity * socDiff) / 100;
            const totalEnergyWithLoss = energyNeeded / efficiency;
            const hoursDecimal = totalEnergyWithLoss / power;

            const hours = Math.floor(hoursDecimal);
            const minutes = Math.round((hoursDecimal - hours) * 60);

            document.getElementById('result-time').innerText = `${hours}h ${minutes < 10 ? '0' : ''}${minutes}min`;
            document.getElementById('result-energy').innerText = `${energyNeeded.toFixed(1)} kWh`;
            
            // Coût estimé basé sur 0.20€ / kWh
            const cost = energyNeeded * 0.20;
            document.getElementById('result-cost').innerText = `${cost.toFixed(2)} €`;
        }

        // Gestion du Stockage Local (LocalStorage)
        function getSavedData() {
            const cars = JSON.parse(localStorage.getItem('electro_cars')) || [];
            const chargers = JSON.parse(localStorage.getItem('electro_chargers')) || [];
            return { cars, chargers };
        }

        function saveCars(cars) {
            localStorage.setItem('electro_cars', JSON.stringify(cars));
        }

        function saveChargers(chargers) {
            localStorage.setItem('electro_chargers', JSON.stringify(chargers));
        }

        function addCar() {
            const name = document.getElementById('new-car-name').value.trim();
            const capacity = parseFloat(document.getElementById('new-car-capacity').value);
            if (!name || isNaN(capacity)) return alert('Veuillez remplir correctement le nom et la capacité.');

            const { cars, chargers } = getSavedData();
            cars.push({ id: Date.now(), name, capacity });
            saveCars(cars);
            document.getElementById('new-car-name').value = '';
            document.getElementById('new-car-capacity').value = '';
            renderStorageLists();
            updateDropdowns();
        }

        function deleteCar(id) {
            let { cars, chargers } = getSavedData();
            cars = cars.filter(c => c.id !== id);
            saveCars(cars);
            renderStorageLists();
            updateDropdowns();
        }

        function addCharger() {
            const name = document.getElementById('new-charger-name').value.trim();
            const power = parseFloat(document.getElementById('new-charger-power').value);
            if (!name || isNaN(power)) return alert('Veuillez remplir correctement le nom et la puissance.');

            const { cars, chargers } = getSavedData();
            chargers.push({ id: Date.now(), name, power });
            saveChargers(chargers);
            document.getElementById('new-charger-name').value = '';
            document.getElementById('new-charger-power').value = '';
            renderStorageLists();
            updateDropdowns();
        }

        function deleteCharger(id) {
            let { cars, chargers } = getSavedData();
            chargers = chargers.filter(c => c.id !== id);
            saveChargers(chargers);
            renderStorageLists();
            updateDropdowns();
        }

        function renderStorageLists() {
            const { cars, chargers } = getSavedData();
            
            // Rendu voitures
            const carsContainer = document.getElementById('cars-list');
            carsContainer.innerHTML = cars.length === 0 ? '<p class="text-xs text-slate-500 italic">Aucun véhicule enregistré.</p>' : '';
            cars.forEach(car => {
                carsContainer.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-900 p-2.5 rounded-lg border border-slate-700/60 text-sm">
                        <div><strong class="text-slate-200">${car.name}</strong> <span class="text-xs text-slate-400">(${car.capacity} kWh)</span></div>
                        <button onclick="deleteCar(${car.id})" class="text-red-400 hover:text-red-300 text-xs px-2 py-1">Supprimer</button>
                    </div>
                `;
            });

            // Rendu bornes
            const chargersContainer = document.getElementById('chargers-list');
            chargersContainer.innerHTML = chargers.length === 0 ? '<p class="text-xs text-slate-500 italic">Aucune borne enregistrée.</p>' : '';
            chargers.forEach(chg => {
                chargersContainer.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-900 p-2.5 rounded-lg border border-slate-700/60 text-sm">
                        <div><strong class="text-slate-200">${chg.name}</strong> <span class="text-xs text-slate-400">(${chg.power} kW)</span></div>
                        <button onclick="deleteCharger(${chg.id})" class="text-red-400 hover:text-red-300 text-xs px-2 py-1">Supprimer</button>
                    </div>
                `;
            });
        }

        function updateDropdowns() {
            const { cars, chargers } = getSavedData();
            
            const carSelect = document.getElementById('select-saved-car');
            carSelect.innerHTML = '<option value="">-- Personnalisé --</option>';
            cars.forEach(c => {
                carSelect.innerHTML += `<option value="${c.capacity}">${c.name} (${c.capacity} kWh)</option>`;
            });

            const chargerSelect = document.getElementById('select-saved-charger');
            chargerSelect.innerHTML = '<option value="">-- Personnalisé --</option>';
            chargers.forEach(ch => {
                chargerSelect.innerHTML += `<option value="${ch.power}">${ch.name} (${ch.power} kW)</option>`;
            });
        }

        // Écouteurs pour les sélecteurs rapides
        document.getElementById('select-saved-car').addEventListener('change', (e) => {
            if (e.target.value) {
                document.getElementById('battery-capacity').value = e.target.value;
                calculate();
            }
        });

        document.getElementById('select-saved-charger').addEventListener('change', (e) => {
            if (e.target.value) {
                document.getElementById('charger-power').value = e.target.value;
                calculate();
            }
        });

        // Initialisation au chargement
        updateDropdowns();
        calculate();
    </script>
</body>
</html>
